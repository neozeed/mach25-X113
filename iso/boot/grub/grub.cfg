set timeout=5
set default=0

menuentry "Mach 2.6 iso directory disk 1" {
    multiboot /boot/loader
    module (hd1,msdos1)/boot/vmunix
    boot
}

menuentry "Mach 2.6 iso directory disk 2" {
    multiboot /boot/loader
    module (hd2,msdos1)/boot/vmunix
    boot
}

menuentry "Mach 2.6 iso directory disk 3" {
    multiboot /boot/loader
    module (hd3,msdos1)/boot/vmunix
    boot
}

menuentry "Mach 2.6 local on iso" {
    multiboot /boot/loader
    module /boot/vmunix
    boot
}
